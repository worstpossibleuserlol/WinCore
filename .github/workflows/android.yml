name: WinCore Android Build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-debug-apk:
    name: Build WinCore debug APK
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      WINCORE_VERSION: 0.4.0
      WINCORE_VERSION_CODE: 400
    steps:
      - name: Checkout WinCore and upstream submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Install Android build components
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          if [[ -z "$SDKMANAGER" ]]; then
            echo "Android SDK manager was not found under $ANDROID_HOME"
            exit 1
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null
          "$SDKMANAGER" --install \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;24.0.8215888" \
            "cmake;3.22.1"

      - name: Apply WinCore branding and diagnostics improvements
        run: bash scripts/apply-wincore-patch.sh upstream "$WINCORE_VERSION"

      - name: Verify diagnostics controls and report fields
        run: |
          grep -q 'BTRefreshWinCoreDiagnostics' upstream/app/app/src/main/res/layout/settings_fragment.xml
          grep -q 'BTShareWinCoreDiagnostics' upstream/app/app/src/main/res/layout/settings_fragment.xml
          grep -q 'Intent.ACTION_SEND' upstream/app/app/src/main/java/com/winlator/SettingsFragment.java
          grep -q 'App process:' upstream/app/app/src/main/java/com/winlator/SettingsFragment.java
          grep -q 'App memory class:' upstream/app/app/src/main/java/com/winlator/SettingsFragment.java
          grep -q 'Vulkan API:' upstream/app/app/src/main/java/com/winlator/SettingsFragment.java
          grep -q 'WinCore 0.4.0 compatibility report' upstream/app/app/src/main/java/com/winlator/SettingsFragment.java

      - name: Build debug APK
        working-directory: upstream/app
        run: bash gradlew --no-daemon --stacktrace assembleDebug

      - name: Verify package metadata and APK integrity
        run: |
          APK="upstream/app/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          unzip -t "$APK"
          AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt"
          BADGING="$("$AAPT" dump badging "$APK")"
          grep -q "package: name='com.wincore'" <<< "$BADGING"
          grep -q "versionCode='$WINCORE_VERSION_CODE'" <<< "$BADGING"
          grep -q "versionName='$WINCORE_VERSION'" <<< "$BADGING"
          unzip -l "$APK" | grep -q 'lib/arm64-v8a/'
          mkdir -p dist
          cp "$APK" "dist/WinCore-$WINCORE_VERSION-debug.apk"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: WinCore-0.4.0-debug
          path: dist/WinCore-0.4.0-debug.apk
          if-no-files-found: error
          retention-days: 14
