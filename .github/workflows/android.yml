name: WinCore Android Build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-debug-apk:
    name: Build WinCore debug APK
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      WINCORE_VERSION: 3.0.0
      WINCORE_VERSION_CODE: 30000
    steps:
      - name: Checkout WinCore and upstream submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Install Android build components
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          if [[ -z "$SDKMANAGER" ]]; then
            echo "Android SDK manager was not found under $ANDROID_HOME"
            exit 1
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null
          "$SDKMANAGER" --install \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;24.0.8215888" \
            "cmake;3.22.1"

      - name: Apply WinCore 3.0.0 profiles, monitoring, and UI controls
        run: bash scripts/apply-wincore-patch.sh upstream "$WINCORE_VERSION"

      - name: Verify WinCore 3.0.0 features and container audit
        run: |
          set -euxo pipefail
          grep -q 'BTRefreshWinCoreDiagnostics' upstream/app/app/src/main/res/layout/settings_fragment.xml
          grep -q 'BTShareWinCoreDiagnostics' upstream/app/app/src/main/res/layout/settings_fragment.xml
          grep -q 'Intent.ACTION_SEND' upstream/app/app/src/main/java/com/winlator/SettingsFragment.java
          grep -q 'Vulkan API:' upstream/app/app/src/main/java/com/winlator/SettingsFragment.java
          grep -q 'Internal app storage:' upstream/app/app/src/main/java/com/winlator/SettingsFragment.java
          grep -q 'External app storage:' upstream/app/app/src/main/java/com/winlator/SettingsFragment.java
          grep -q 'getAvailableBytes()' upstream/app/app/src/main/java/com/winlator/SettingsFragment.java
          grep -q 'BTCheckWinCoreContainers' upstream/app/app/src/main/res/layout/settings_fragment.xml
          grep -q 'buildWinCoreContainerAudit' upstream/app/app/src/main/java/com/winlator/SettingsFragment.java
          grep -q 'drive_c/windows' upstream/app/app/src/main/java/com/winlator/SettingsFragment.java
          grep -q 'Box64PresetManager.getPreset' upstream/app/app/src/main/java/com/winlator/SettingsFragment.java
          grep -q 'Display resolution:' upstream/app/app/src/main/java/com/winlator/SettingsFragment.java
          grep -q 'Environment variables:' upstream/app/app/src/main/java/com/winlator/SettingsFragment.java
          grep -q 'Drive mappings:' upstream/app/app/src/main/java/com/winlator/SettingsFragment.java
          grep -q 'Mapped drive availability:' upstream/app/app/src/main/java/com/winlator/SettingsFragment.java
          grep -q 'Container Audit Summary' upstream/app/app/src/main/java/com/winlator/SettingsFragment.java
          grep -q 'buildWinCoreContainerAuditWithSummary' upstream/app/app/src/main/java/com/winlator/SettingsFragment.java
          grep -q 'rootFS != null && rootFS.isValid()' upstream/app/app/src/main/java/com/winlator/SettingsFragment.java
          grep -q 'audit could not complete safely; saved data may be malformed' upstream/app/app/src/main/java/com/winlator/SettingsFragment.java
          grep -q 'WinCoreDeviceProfile.resolveBox64Preset(context, box64Preset, winCoreDeviceProfile)' upstream/app/app/src/main/java/com/winlator/xenvironment/components/GuestProgramLauncherComponent.java
          grep -q 'SWinCoreDeviceProfile' upstream/app/app/src/main/res/layout/settings_fragment.xml
          grep -q 'CPVWinCoreAccent' upstream/app/app/src/main/res/layout/settings_fragment.xml
          grep -q 'SWinCoreUIDensity' upstream/app/app/src/main/res/layout/settings_fragment.xml
          grep -q 'WinCoreAppearance.apply' upstream/app/app/src/main/java/com/winlator/MainActivity.java
          grep -q 'wincore_ui_accent' upstream/app/app/src/main/java/com/winlator/SettingsFragment.java
          grep -q 'wincore_ui_density' upstream/app/app/src/main/java/com/winlator/SettingsFragment.java
          grep -q 'WinCore 3.0.0 compatibility report' upstream/app/app/src/main/java/com/winlator/SettingsFragment.java
          test -s upstream/app/app/src/main/java/com/winlator/WinCoreDeviceProfile.java
          grep -q 'setWinCoreDeviceProfile(selectedWinCoreProfile)' upstream/app/app/src/main/java/com/winlator/XServerDisplayActivity.java
          grep -q 'wincore_cpu_profile' upstream/app/app/src/main/java/com/winlator/ContainerDetailFragment.java
          grep -q 'wincore_cpu_profile' upstream/app/app/src/main/java/com/winlator/contentdialog/ShortcutSettingsDialog.java
          grep -q 'wincore_box64_preset_dimensity' upstream/app/app/src/main/java/com/winlator/WinCoreDeviceProfile.java
          grep -q 'wincore_adaptive_launch' upstream/app/app/src/main/java/com/winlator/WinCoreDeviceProfile.java
          grep -q 'THERMAL_STATUS_SEVERE' upstream/app/app/src/main/java/com/winlator/WinCoreDeviceProfile.java
          grep -q 'new WinCorePerformanceOverlay(this)' upstream/app/app/src/main/java/com/winlator/XServerDisplayActivity.java
          grep -q 'Battery temperature:' upstream/app/app/src/main/java/com/winlator/WinCorePerformanceOverlay.java
          grep -q 'BTWinCoreShareProfile' upstream/app/app/src/main/res/layout/settings_fragment.xml
          grep -q 'wincore-profile-v1' upstream/app/app/src/main/java/com/winlator/SettingsFragment.java
          grep -q 'WinCore 3.0.0 compatibility report' upstream/app/app/src/main/java/com/winlator/SettingsFragment.java
          test -s upstream/app/app/src/main/java/com/winlator/WinCoreProfileControls.java
          test -s upstream/app/app/src/main/java/com/winlator/WinCorePerformanceOverlay.java

      - name: Build debug APK
        working-directory: upstream/app
        run: bash gradlew --no-daemon --stacktrace assembleDebug

      - name: Verify package metadata and APK integrity
        run: |
          APK="upstream/app/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          unzip -t "$APK"
          AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt"
          BADGING="$("$AAPT" dump badging "$APK")"
          grep -q "package: name='com.wincore'" <<< "$BADGING"
          grep -q "versionCode='$WINCORE_VERSION_CODE'" <<< "$BADGING"
          grep -q "versionName='$WINCORE_VERSION'" <<< "$BADGING"
          unzip -l "$APK" | grep -q 'lib/arm64-v8a/'
          mkdir -p dist
          cp "$APK" "dist/WinCore-$WINCORE_VERSION-release-debug.apk"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: WinCore-3.0.0-release-debug
          path: dist/WinCore-3.0.0-release-debug.apk
          if-no-files-found: error
          retention-days: 14
