name: WinCore Android Build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-debug-apk:
    name: Build WinCore debug APK
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      WINCORE_VERSION: 7.0.0
      WINCORE_VERSION_CODE: 70000
    steps:
      - name: Checkout WinCore and upstream submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Install Android build components
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick python3-pil
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          if [[ -z "$SDKMANAGER" ]]; then
            echo "Android SDK manager was not found under $ANDROID_HOME"
            exit 1
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null
          "$SDKMANAGER" --install \
            "platforms;android-35" \
            "build-tools;37.0.0" \
            "ndk;24.0.8215888" \
            "cmake;3.22.1"

      - name: Apply WinCore 3.0.0 foundation with 7.0.0 version metadata
        run: bash scripts/apply-wincore-patch.sh upstream "$WINCORE_VERSION"

      - name: Verify WinCore 3.0.0 features and container audit
        run: |
          set -euxo pipefail
          grep -q 'BTRefreshWinCoreDiagnostics' upstream/app/app/src/main/res/layout/settings_fragment.xml
          grep -q 'BTShareWinCoreDiagnostics' upstream/app/app/src/main/res/layout/settings_fragment.xml
          grep -q 'Intent.ACTION_SEND' upstream/app/app/src/main/java/com/winlator/SettingsFragment.java
          grep -q 'Vulkan API:' upstream/app/app/src/main/java/com/winlator/SettingsFragment.java
          grep -q 'Internal app storage:' upstream/app/app/src/main/java/com/winlator/SettingsFragment.java
          grep -q 'External app storage:' upstream/app/app/src/main/java/com/winlator/SettingsFragment.java
          grep -q 'getAvailableBytes()' upstream/app/app/src/main/java/com/winlator/SettingsFragment.java
          grep -q 'BTCheckWinCoreContainers' upstream/app/app/src/main/res/layout/settings_fragment.xml
          grep -q 'buildWinCoreContainerAudit' upstream/app/app/src/main/java/com/winlator/SettingsFragment.java
          grep -q 'drive_c/windows' upstream/app/app/src/main/java/com/winlator/SettingsFragment.java
          grep -q 'Box64PresetManager.getPreset' upstream/app/app/src/main/java/com/winlator/SettingsFragment.java
          grep -q 'Display resolution:' upstream/app/app/src/main/java/com/winlator/SettingsFragment.java
          grep -q 'Environment variables:' upstream/app/app/src/main/java/com/winlator/SettingsFragment.java
          grep -q 'Drive mappings:' upstream/app/app/src/main/java/com/winlator/SettingsFragment.java
          grep -q 'Mapped drive availability:' upstream/app/app/src/main/java/com/winlator/SettingsFragment.java
          grep -q 'Container Audit Summary' upstream/app/app/src/main/java/com/winlator/SettingsFragment.java
          grep -q 'buildWinCoreContainerAuditWithSummary' upstream/app/app/src/main/java/com/winlator/SettingsFragment.java
          grep -q 'rootFS != null && rootFS.isValid()' upstream/app/app/src/main/java/com/winlator/SettingsFragment.java
          grep -q 'audit could not complete safely; saved data may be malformed' upstream/app/app/src/main/java/com/winlator/SettingsFragment.java
          grep -q 'WinCoreDeviceProfile.resolveBox64Preset(context, box64Preset, winCoreDeviceProfile)' upstream/app/app/src/main/java/com/winlator/xenvironment/components/GuestProgramLauncherComponent.java
          grep -q 'SWinCoreDeviceProfile' upstream/app/app/src/main/res/layout/settings_fragment.xml
          grep -q 'CPVWinCoreAccent' upstream/app/app/src/main/res/layout/settings_fragment.xml
          grep -q 'SWinCoreUIDensity' upstream/app/app/src/main/res/layout/settings_fragment.xml
          grep -q 'WinCoreAppearance.apply' upstream/app/app/src/main/java/com/winlator/MainActivity.java
          grep -q 'wincore_ui_accent' upstream/app/app/src/main/java/com/winlator/SettingsFragment.java
          grep -q 'wincore_ui_density' upstream/app/app/src/main/java/com/winlator/SettingsFragment.java
          grep -q 'WinCore 7.0.0 compatibility report' upstream/app/app/src/main/java/com/winlator/SettingsFragment.java
          test -s upstream/app/app/src/main/java/com/winlator/WinCoreDeviceProfile.java
          grep -q 'setWinCoreDeviceProfile(selectedWinCoreProfile)' upstream/app/app/src/main/java/com/winlator/XServerDisplayActivity.java
          grep -q 'wincore_cpu_profile' upstream/app/app/src/main/java/com/winlator/ContainerDetailFragment.java
          grep -q 'wincore_cpu_profile' upstream/app/app/src/main/java/com/winlator/contentdialog/ShortcutSettingsDialog.java
          grep -q 'wincore_box64_preset_dimensity' upstream/app/app/src/main/java/com/winlator/WinCoreDeviceProfile.java
          grep -q 'wincore_adaptive_launch' upstream/app/app/src/main/java/com/winlator/WinCoreDeviceProfile.java
          grep -q 'THERMAL_STATUS_SEVERE' upstream/app/app/src/main/java/com/winlator/WinCoreDeviceProfile.java
          grep -q 'new WinCorePerformanceOverlay(this)' upstream/app/app/src/main/java/com/winlator/XServerDisplayActivity.java
          grep -q 'Battery temperature:' upstream/app/app/src/main/java/com/winlator/WinCorePerformanceOverlay.java
          grep -q 'BTWinCoreShareProfile' upstream/app/app/src/main/res/layout/settings_fragment.xml
          grep -q 'wincore-profile-v1' upstream/app/app/src/main/java/com/winlator/SettingsFragment.java
          grep -q 'WinCore 7.0.0 compatibility report' upstream/app/app/src/main/java/com/winlator/SettingsFragment.java
          test -s upstream/app/app/src/main/java/com/winlator/WinCoreProfileControls.java
          test -s upstream/app/app/src/main/java/com/winlator/WinCorePerformanceOverlay.java

      - name: Apply WinCore 7.0.0 features, container fixes, About fixes, and user-supplied drawer branding
        run: bash scripts/apply-wincore-7.0.0.sh

      - name: Apply WinCore 7.0.0 features, container fixes, About fixes, and user-supplied drawer branding
        run: bash scripts/apply-wincore-7.0.0.sh

      - name: Apply Mali compatibility and container reliability fixes (WinCore 7.0.0)
        run: bash scripts/apply-wincore-mali-container-fix.sh upstream

      - name: Verify Mali and container reliability patch
        run: |
          set -euxo pipefail
          grep -q 'completed.await(1200, TimeUnit.MILLISECONDS)' upstream/app/app/src/main/java/com/winlator/core/GPUHelper.java
          grep -q 'WinCoreMaliCompatibility.resolveGraphicsDriver(this' upstream/app/app/src/main/java/com/winlator/XServerDisplayActivity.java
          grep -q 'WinCoreMaliCompatibility.configureWineD3D(this, this.graphicsDriver' upstream/app/app/src/main/java/com/winlator/XServerDisplayActivity.java
          grep -q 'WinCoreMaliCompatibility.applyEnvironment(this, graphicsDriver, dxwrapper, envVars)' upstream/app/app/src/main/java/com/winlator/XServerDisplayActivity.java
          grep -q 'CBWinCoreMaliCompatibility' upstream/app/app/src/main/res/layout/settings_fragment.xml
          grep -q 'CBWinCoreMaliVirGLFallback' upstream/app/app/src/main/res/layout/settings_fragment.xml
          grep -q 'getLastOperationError()' upstream/app/app/src/main/java/com/winlator/container/ContainerManager.java
          grep -q 'ProcessHelper.startProcess(command, envVars, rootDir)' upstream/app/app/src/main/java/com/winlator/xenvironment/components/GuestProgramLauncherComponent.java
          grep -q 'WinCore-Guest-Process-Waiter' upstream/app/app/src/main/java/com/winlator/xenvironment/components/GuestProgramLauncherComponent.java
          grep -q 'startupHandler.postDelayed(startupTimeout, 60000L)' upstream/app/app/src/main/java/com/winlator/XServerDisplayActivity.java
          grep -q 'versionName "7.0.0"' upstream/app/app/build.gradle

      - name: Verify WinCore 7.0.0 features, About dialog, text colors, and icon integrity
        run: |
          set -euxo pipefail
          test -s upstream/app/app/src/main/java/com/winlator/WinCoreCompatibilityCenterActivity.java
          test -s upstream/app/app/src/main/java/com/winlator/WinCoreSessionTracker.java
          test -s upstream/app/app/src/main/java/com/winlator/WinCoreSevenActivity.java
          test -s upstream/app/app/src/main/java/com/winlator/contentdialog/AboutDialog.java
          test -s upstream/app/app/src/main/res/layout/about_dialog.xml
          test -s upstream/app/app/src/main/res/drawable/wincore_about_logo.xml
          grep -q 'website.setVisibility(View.GONE)' upstream/app/app/src/main/java/com/winlator/contentdialog/AboutDialog.java
          ! grep -qi 'winlator.org' upstream/app/app/src/main/java/com/winlator/contentdialog/AboutDialog.java
          grep -q 'android:src="@drawable/wincore_about_logo"' upstream/app/app/src/main/res/layout/about_dialog.xml
          ! grep -q '@mipmap/ic_launcher' upstream/app/app/src/main/res/layout/about_dialog.xml
          grep -q 'setTextColor(0xffffffff)' upstream/app/app/src/main/java/com/winlator/WinCoreCompatibilityCenterActivity.java
          grep -q 'setHintTextColor(0xffb8c0c8)' upstream/app/app/src/main/java/com/winlator/WinCoreCompatibilityCenterActivity.java
          grep -q 'BTWinCoreCompatibilityCenter' upstream/app/app/src/main/res/layout/settings_fragment.xml
          grep -q 'WinCoreSessionTracker.onSessionStart' upstream/app/app/src/main/java/com/winlator/XServerDisplayActivity.java
          grep -q 'WinCoreSessionTracker.onSessionEnd' upstream/app/app/src/main/java/com/winlator/XServerDisplayActivity.java
          WORKSPACE="upstream/app/app/src/main/java/com/winlator/WinCoreSevenActivity.java"
          for label in \
            "instant container selection" "background container loading" "container metadata cache" \
            "smart cache invalidation" "lazy tab loading" "lazy registry access" \
            "asynchronous registry processing" "loading progress indicator" "corrupted-container isolation" \
            "atomic configuration saving" "container search" "custom sorting" "favorite containers" \
            "recently opened containers" "storage usage dashboard" "complete container backup" \
            "verified container restoration" "configuration snapshots" "duplicate progress tracking" \
            "bulk backup management" "pre-launch inspection" "missing runtime detector" \
            "Wine prefix health check" "per-session log collection" "crash report analyzer" \
            "safe launch mode" "custom executable arguments" "configuration comparison" \
            "shader cache manager" "game compatibility catalogue" "controller-first navigation" \
            "quick container actions" "game library search" "game categories" "custom game artwork" \
            "recently played games screen" "improved contextual error messages" "accessibility improvements" \
            "tablet layout" "advanced settings search" "automatic configuration backups" \
            "configuration rollback" "container migration assistant" "storage cleanup assistant" \
            "container permission repair" "upstream compatibility checker" "automated container tests" \
            "automated UI tests" "APK regression testing" "build diagnostics report"; do
            grep -Fq "\"$label\"" "$WORKSPACE"
          done
          grep -q 'BTWinCore7Workspace' upstream/app/app/src/main/res/layout/settings_fragment.xml
          grep -q 'new Intent(context, WinCoreSevenActivity.class)' upstream/app/app/src/main/java/com/winlator/SettingsFragment.java
          grep -q 'android:name="com.winlator.WinCoreSevenActivity"' upstream/app/app/src/main/AndroidManifest.xml
          grep -q 'new AtomicFile(getConfigFile())' upstream/app/app/src/main/java/com/winlator/container/Container.java
          grep -q 'WinCoreSevenActivity.recordGameLaunch' upstream/app/app/src/main/java/com/winlator/ShortcutsFragment.java
          grep -q 'private void restoreFromUri' "$WORKSPACE"
          grep -q 'private void restoreSymlinks' "$WORKSPACE"
          grep -q 'AtomicFile atomic = new AtomicFile(file)' "$WORKSPACE"
          test -s upstream/app/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
          test -s upstream/app/app/src/main/res/mipmap-xxxhdpi/ic_launcher_round.png
          test -s upstream/app/app/src/main/res/mipmap-xxxhdpi/ic_launcher_foreground.png
          ACTIVITY="upstream/app/app/src/main/java/com/winlator/WinCoreCompatibilityCenterActivity.java"
          for label in \
            "01  Automatic game detection" "02  Executable analyzer" "03  Per-game profile manager" \
            "04  Local compatibility database" "05  Automatic profile matching" "06  Wine version advisor" \
            "07  Box64 preset advisor" "08  DirectX requirement detection" "09  Graphics wrapper checker" \
            "10  Launch argument manager" "11  RAM pressure monitor" "12  Low-memory warning system" \
            "13  CPU load snapshot" "14  Thermal awareness" "15  Battery performance recommendations" \
            "16  Background process awareness" "17  Per-game performance preferences" "18  Resolution advisor" \
            "19  Frame-pacing diagnostics status" "20  Session performance report" "21  GTA IV dedicated profile" \
            "22  GTA IV executable detection" "23  GTA IV DirectX 9 check" "24  GTA IV component presence check" \
            "25  Controller diagnostics" "26  Audio device diagnostics" "27  GTA IV save-data clue check" \
            "28  GTA IV profile backup" "29  Crash / failure log report" "30  GTA IV compatibility summary" \
            "31  Wine log viewer" "32  Box64 log viewer" "33  Missing DLL log detector" \
            "34  Graphics initialization diagnostics" "35  Vulkan capability checker" \
            "36  Selected game-folder health report" "37  Configuration conflict detector" \
            "38  WinCore settings backup" "39  Previous profile rollback" "40  Diagnostic report export" \
            "41  Shared profile import / export" "42  Local shared-profile library" "43  Profile version history" \
            "44  Container backup checklist" "45  Container migration assistant" "46  Launch history" \
            "47  Compatibility rating" "48  Custom compatibility rules" "49  Profile comparison" \
            "50  Compatibility dashboard summary"; do
            grep -Fq "$label" "$ACTIVITY"
          done
          COMPAT="$ACTIVITY"
          for label in \
            "01  Automatic game profiles" \
            "02  Game version and file metadata" \
            "03  Multi-executable game detection" \
            "04  Per-game settings presets" \
            "05  Automatic profile selection" \
            "06  Game configuration comparison" \
            "07  Profile change history" \
            "08  One-tap profile restore" \
            "09  Game-specific environment variables" \
            "10  Launch argument manager" \
            "11  Graphics compatibility scanner" \
            "12  Vulkan capability details" \
            "13  OpenGL capability details" \
            "14  DXVK configuration manager" \
            "15  VKD3D configuration manager" \
            "16  Graphics wrapper compatibility checks" \
            "17  Renderer selection profiles" \
            "18  Resolution profiles" \
            "19  Fullscreen compatibility checks" \
            "20  Graphics error analyzer" \
            "21  Memory pressure history" \
            "22  Thermal history" \
            "23  Battery impact report" \
            "24  Background application warning" \
            "25  Launch resource estimator" \
            "26  CPU profile comparison" \
            "27  Session stability tracker" \
            "28  Startup time history" \
            "29  Low-storage warnings" \
            "30  Performance report export" \
            "31  Crash report timeline" \
            "32  Diagnostic bundle export" \
            "33  Wine error categorization" \
            "34  Box64 error categorization" \
            "35  Missing component suggestions" \
            "36  Selected folder integrity comparison" \
            "37  Configuration conflict detection" \
            "38  Pre-launch configuration backup" \
            "39  Recovery mode" \
            "40  Diagnostic report comparison" \
            "41  Game library categories" \
            "42  Game cover images" \
            "43  Custom game notes" \
            "44  Favorite games" \
            "45  Recent game activity" \
            "46  Profile import validation" \
            "47  Profile export validation" \
            "48  Settings migration assistant" \
            "49  Custom dashboard layout" \
            "50  Compatibility Center 2.0 dashboard"; do
            grep -Fq "$label" "$COMPAT"
          done
          ICON="assets/branding/wincore-app-icon.png"
          test -s "$ICON"
          for density in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            case "$density" in
              mdpi) SIZE=48 ;;
              hdpi) SIZE=72 ;;
              xhdpi) SIZE=96 ;;
              xxhdpi) SIZE=144 ;;
              xxxhdpi) SIZE=192 ;;
            esac
            for icon_name in ic_launcher.png ic_launcher_round.png ic_launcher_foreground.png; do
              test "$(identify -format '%wx%h' "upstream/app/app/src/main/res/mipmap-$density/$icon_name")" = "${SIZE}x${SIZE}"
            done
          done
          grep -q 'android:roundIcon="@mipmap/ic_launcher_round"' upstream/app/app/src/main/AndroidManifest.xml
          grep -q '@mipmap/ic_launcher_foreground' upstream/app/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml

      - name: Verify WinCore 7.0.0 navigation branding and container fixes
        run: |
          set -euxo pipefail
          test -s "assets/branding/wincorebanner.png"
          cmp -s "assets/branding/wincorebanner.png" upstream/app/app/src/main/res/drawable/logo.png
          cmp -s "assets/branding/wincorebanner.png" upstream/app/app/src/main/res/drawable-hdpi/logo.png
          grep -q 'android:src="@drawable/logo"' upstream/app/app/src/main/res/layout/main_menu_header.xml
          grep -q 'android:scaleType="fitCenter"' upstream/app/app/src/main/res/layout/main_menu_header.xml
          grep -q 'new ContainerManager(context, containerId)' upstream/app/app/src/main/java/com/winlator/ContainerDetailFragment.java
          grep -q 'loadContainers(int selectedContainerId)' upstream/app/app/src/main/java/com/winlator/container/ContainerManager.java
          grep -q 'Skipping unreadable container' upstream/app/app/src/main/java/com/winlator/container/ContainerManager.java
          grep -q 'private boolean ensureClone()' upstream/app/app/src/main/java/com/winlator/core/WineRegistryEditor.java
          grep -q 'if (!ensureClone()) return;' upstream/app/app/src/main/java/com/winlator/core/WineRegistryEditor.java
          grep -q 'private static final ExecutorService IO_EXECUTOR' upstream/app/app/src/main/java/com/winlator/container/ContainerManager.java
          ! grep -q 'Executors.newSingleThreadExecutor().execute' upstream/app/app/src/main/java/com/winlator/container/ContainerManager.java

      - name: Build debug APK
        working-directory: upstream/app
        run: bash gradlew --no-daemon --stacktrace assembleDebug

      - name: Verify package metadata and APK integrity
        run: |
          APK="upstream/app/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          unzip -t "$APK"
          AAPT="$ANDROID_HOME/build-tools/37.0.0/aapt"
          BADGING="$("$AAPT" dump badging "$APK")"
          grep -q "package: name='com.wincore'" <<< "$BADGING"
          grep -q "versionCode='$WINCORE_VERSION_CODE'" <<< "$BADGING"
          grep -q "versionName='$WINCORE_VERSION'" <<< "$BADGING"
          unzip -l "$APK" | grep -q 'lib/arm64-v8a/'
          mkdir -p dist
          cp "$APK" "dist/WinCore-$WINCORE_VERSION.apk"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: WinCore-7.0.0
          path: dist/WinCore-7.0.0.apk
          if-no-files-found: error
          retention-days: 14
