<svg xmlns="http://www.w3.org/2000/svg" width="1536" height="523" viewBox="0 0 1536 523" role="img" aria-labelledby="title desc">
  <title id="title">WinCore</title>
  <desc id="desc">Green four-panel window mark beside the WinCore wordmark.</desc>
  <rect width="1536" height="523" fill="#ffffff"/>
  <defs>
    <linearGradient id="frame" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9dca00"/>
      <stop offset="0.52" stop-color="#8fbd00"/>
      <stop offset="1" stop-color="#609500"/>
    </linearGradient>
  </defs>
